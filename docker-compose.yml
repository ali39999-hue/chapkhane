version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chapkhane}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

  preflight-worker:
    build: 
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - redis
      - minio
    environment:
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET_PRIVATE=${S3_BUCKET_PRIVATE:-private-artwork}
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-password123}
      - WEBHOOK_URL=http://host.docker.internal:3000/api/preflight-webhook
      - PREFLIGHT_WEBHOOK_SECRET=${PREFLIGHT_WEBHOOK_SECRET:-chapkhane-internal-secret}

volumes:
  pgdata:
  redisdata:
  miniodata:
